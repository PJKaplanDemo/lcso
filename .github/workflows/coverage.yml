name: LCSO Coverage

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev gfortran libopenblas-dev
    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin
    - name: Run tests
      run: cargo test
    - name: Check coverage (95% minimum)
      run: cargo tarpaulin --out Stdout --fail-under 95
